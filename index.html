<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080f1d"><meta name="description" content="30 mô hình dashboard KPI đa lĩnh vực, mỗi mô hình 9 biểu đồ neon SVG, chạy offline và xuất HTML độc lập."><title>Neon Matrix · 30 KPI Dashboard Models</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;--bg:#060a13;--surface:#0c1525;--surface2:#111e32;--border:#1a3047;--txt:#e7f3ff;--muted:#8a9eb7;--cyan:#40e6ff;--pink:#f370ff;--lime:#a3ff8c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 60% -28%,#142844 0%,#080f1c 50%,#060a13 100%);color:var(--txt);min-width:320px}
button,input,select{font:inherit}button{cursor:pointer}a{color:var(--cyan)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.app{height:100dvh;display:flex;overflow:hidden}
.sidebar{width:264px;flex-shrink:0;border-right:1px solid #213449;background:#080f1d;display:flex;flex-direction:column;min-height:0}

.mark{display:grid;place-items:center;width:42px;height:42px;border:1px solid #42dfff80;border-radius:13px;background:#0c2434;color:var(--cyan);box-shadow:0 0 26px #00e4ff22;font-weight:900;font-size:24px}
.brand strong{display:block;font-size:16px;letter-spacing:.5px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.2px;margin-top:3px}
.searchBox{margin:15px 12px 8px;position:relative}.searchBox span{position:absolute;left:11px;top:10px;color:#6886a3}
.searchBox input{width:100%;height:38px;background:#111e2f;border:1px solid #263d56;border-radius:9px;color:var(--txt);padding:0 12px 0 35px;font-size:12px}
.category{margin:0 12px 10px;width:calc(100% - 24px);padding:10px;color:#bdd3e8;background:#101d2d;border:1px solid #263d56;border-radius:9px;font-size:12px}
.sidebar-label{display:flex;justify-content:space-between;margin:7px 17px 8px;font-size:10px;color:#7188a3;text-transform:uppercase;font-weight:700;letter-spacing:1.3px}
.model-list{padding:0 8px 16px;overflow:auto;scrollbar-width:thin;scrollbar-color:#35526c transparent}
.model-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 10px;text-align:left;border:1px solid transparent;background:transparent;color:#9eb3cc;border-radius:10px;margin-bottom:3px}
.model-btn:hover{background:#142339;color:#fff}.model-btn.active{background:linear-gradient(90deg,#142d41,#101f33);border-color:#246681;color:#fff;box-shadow:inset 3px 0 0 var(--cyan),0 0 20px #13bcd719}
.model-btn .emoji{font-size:18px}.model-btn .num{margin-left:auto;font-size:10px;font-variant-numeric:tabular-nums;color:#6f89a3}
.side-bottom{padding:14px 16px;border-top:1px solid var(--border);font-size:10px;color:#7d96b0;line-height:1.7}
.main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.topbar{height:68px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 23px;border-bottom:1px solid #24394f;background:#0a1321b5;backdrop-filter:blur(10px)}
.head-left .eyebrow{font-size:10px;letter-spacing:2px;font-weight:800;color:var(--cyan);text-transform:uppercase}.head-left .headline{font-size:17px;letter-spacing:-.35px;font-weight:750;margin-top:4px}
.actions,.tool-actions,.inline-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid #31516a;border-radius:9px;padding:10px 12px;background:#102137;color:#d9ecff;font-size:11px;font-weight:750;white-space:nowrap;transition:.18s}
.btn:hover{border-color:#6fd8ff;background:#15314b;transform:translateY(-1px)}
.btn.primary{background:linear-gradient(110deg,#0b7c9d,#2358a8);border-color:#38bce4;color:#fff;box-shadow:0 0 22px #0bbdfa24}.btn.accent{border-color:#aa5cff99;background:#30214d;color:#f1d9ff}
.workspace{--h:190;flex:1;min-height:0;overflow:auto;padding:19px 22px 14px;scrollbar-width:thin;scrollbar-color:#314d6c transparent}
.workspace::before{content:"";position:fixed;right:12%;top:18%;width:270px;height:270px;border-radius:50%;background:hsl(var(--h) 100% 60% / .055);pointer-events:none;filter:blur(90px)}
.overview{display:flex;align-items:flex-start;gap:14px;justify-content:space-between;margin-bottom:15px}
.section-title{display:flex;align-items:center;gap:11px}.section-title .bigicon{font-size:31px;display:grid;place-items:center;width:49px;height:49px;border:1px solid hsl(var(--h) 100% 65% / .33);border-radius:14px;background:hsl(var(--h) 100% 50% / .12)}
.overview h1{font-size:22px;line-height:1.2;letter-spacing:-.5px;margin:0 0 5px}.overview p{font-size:12px;margin:0;color:var(--muted);line-height:1.4}
.flag{font-size:10px;border:1px solid #cb9b43;background:#312515;color:#f2c578;border-radius:100px;padding:8px 11px;font-weight:750;white-space:nowrap}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.filter{display:flex;align-items:center;gap:7px;border:1px solid #2b435b;background:#0d1b2e;border-radius:9px;padding:6px 9px;font-size:11px;color:#8faec7}

.sim-toggle{display:flex;align-items:center;gap:7px}.sim-dot{height:7px;width:7px;border-radius:50%;background:#f8ac5e;box-shadow:0 0 10px #ffb66d}.sim-dot.on{background:#5cffb4;box-shadow:0 0 12px #5cffb4}

.metric::after{content:"";width:100px;height:100px;border-radius:50%;position:absolute;right:-43px;top:-57px;background:hsl(var(--h) 95% 61% / .09)}

.chart-card .chart-head{display:flex;justify-content:space-between;align-items:center;gap:5px;padding:11px 12px 2px}
.chart-title{font-size:11px;font-weight:750;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart-head .tools{display:flex;gap:4px}
.icon-btn{font-size:12px;color:#7597b7;background:transparent;border:1px solid transparent;border-radius:6px;min-width:24px;height:23px}
.icon-btn:hover{border-color:#36627e;color:#ecfbff;background:#1c3149}
.chart-content{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:1px 9px 7px;position:relative}
.chart-content svg{display:block;width:100%;height:100%;max-height:174px;overflow:visible;filter:drop-shadow(0 0 6px #10d2ed10)}
.chart-foot{padding:0 12px 9px;display:flex;align-items:center;justify-content:space-between;color:#647e99;font-size:9px}
.chart-foot em{font-style:normal;color:hsl(var(--h) 100% 66%)}
.footer{display:flex;justify-content:space-between;gap:8px;padding:13px 0 2px;font-size:10px;color:#728ba5;flex-wrap:wrap}.footer a{color:#9bdffc;text-decoration:none}

dialog{border:1px solid #346480;border-radius:16px;color:#e8f5ff;background:#0c1929;box-shadow:0 28px 100px #000a;width:min(780px,94vw);padding:0}

.modal-header{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid #243e54}
.modal-body{padding:16px 22px 22px}.modal-body svg{width:100%;height:340px}.modal-body p{font-size:12px;color:#a4bad0;line-height:1.65}.modal-actions{display:flex;justify-content:flex-end;gap:8px}

    for(let k=0;k<4;k++)s+=ln(28,23+k*36,325,23+k*36,dim,.8,"4 5");
    for(let k=0;k<27;k++){const x=35+n()*285,y=28+(1-n())*102;
      s+=ci(x,y,2+n()*3,k%4?A:B,`opacity="${f(.4+n()*.6)}"`) }
    s+=tx(177,154,"BIẾN X · GIẢ ĐỊNH",muted,9);
  }
  else if(type==="bubble"){
    for(let k=0;k<13;k++){const x=30+n()*276,y=20+n()*110,r=5+n()*17;
      s+=ci(x,y,r,[A,C,B,D][k%4],`opacity=".23" stroke="${[A,C,B,D][k%4]}" stroke-width="1.4"`)}
    s+=tx(170,154,"QUY MÔ TƯƠNG QUAN",muted,9);
  }
  else if(type==="waterfall"){
    let current=48;
    for(let k=0;k<7;k++){let next=clamp(current+((n()-.43)*32),18,88),from=130-current,yTo=130-next;let x=31+k*43;
      s+=rc(x,Math.min(from,yTo),24,Math.abs(from-yTo)+3,next>current?A:B,2);
      s+=ln(x+24,yTo,x+43,yTo,dim,1,"3 3");
      s+=tx(x+12,151,k===0?"Đầu":k===6?"Cuối":"Δ"+k,muted,9);current=next}
  }
  else if(type==="funnel"){
    for(let k=0;k<5;k++){const w=286-k*47,x=170-w/2,y=12+k*29,wb=w-37;
      s+=`<polygon points="${f(x)},${y} ${f(x+w)},${y} ${f(170+wb/2)},${y+26} ${f(170-wb/2)},${y+26}" fill="${[A,C,B,D,A][k]}" opacity="${f(.84-k*.11)}"/>`;
      s+=tx(170,y+17,(100-k*17)+"% · "+cat[k].slice(0,10),"#081425",9)}
  }
  else if(type==="treemap"){
    const shapes=[[14,16,144,87,0],[162,16,164,45,1],[162,65,77,74,2],[244,65,82,74,3],[14,107,69,32,4],[87,107,71,32,5]];
    shapes.forEach(([x,y,w,h,k])=>{s+=rc(x,y,w,h,[A,C,B,D,"#6affb0","#a780ff"][k],5);
      s+=tx(x+8,y+18,cat[k].slice(0,Math.max(6,Math.floor(w/9))),"#06111d",10,"start");
      if(h>50)s+=tx(x+9,y+36,v[k]+"%", "#122032",13,"start");});
  }
  else if(type==="stacked"){
    for(let k=0;k<5;k++){let y=18+k*26,x=68,sizes=[.25+n()*.2,.18+n()*.17,.16+n()*.15,.1+n()*.12];
      s+=tx(4,y+10,cat[k].slice(0,8),muted,9,"start");
      sizes.forEach((z,j)=>{const w=235*z;s+=rc(x,y,w-2,16,[A,C,B,D][j],2);x+=w;})}
  }
  else if(type==="timeline"){
    for(let k=0;k<5;k++){const y=20+k*26,start=35+15*n()*6,w=65+125*n();
      s+=ln(26,y+7,318,y+7,dim,3);
      s+=rc(start,y,w,14,[A,C,B,D,A][k],7);
      s+=ci(start,y+7,3,"#e0f5ff");
      s+=tx(5,y+11,k+1,muted,9,"start")}
    s+=tx(170,155,"CHU KỲ THỰC HIỆN · MÔ PHỎNG",muted,9)
  }
  else if(type==="candlestick"){
    s+=ln(25,138,318,138,dim);
    for(let k=0;k<10;k++){let x=39+k*28,op=40+n()*63,cl=40+n()*63,lo=Math.max(op,cl)+n()*18,hi=Math.min(op,cl)-n()*20;
      s+=ln(x,hi,x,lo,op>cl?A:B,1.6);
      s+=rc(x-6,Math.min(op,cl),12,Math.abs(op-cl)+2,op>cl?A:B,1);
      s+=tx(x,153,""+(k+1),muted,8)}
  }
  else if(type==="radial"){
    const cx=168,cy=78;
    for(let k=0;k<10;k++){const an=(k*Math.PI/5)-Math.PI/2,rr=19+v[k]*.6;
      s+=ln(cx+Math.cos(an)*22,cy+Math.sin(an)*22,cx+Math.cos(an)*rr,cy+Math.sin(an)*rr,[A,C,B,D][k%4],9);
    }
    s+=ci(cx,cy,16,"#132338")+tx(cx,cy+4,"KPI","#d1edff",11);
  }
  let title=chartNames[type]+" · "+m.name;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 164" role="img" aria-label="${safe(title)}"><title>${safe(title)}</title><defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="${A}" stop-opacity=".9"/><stop offset="1" stop-color="${A}" stop-opacity=".03"/></linearGradient></defs>${s}</svg>`;
}
function appShell(){
 $("#app").innerHTML=`<aside class="sidebar">
 <div class="brand"><span class="mark">▦</span><div><strong>NEON MATRIX</strong><small>KPI VISUAL STUDIO / 30</small></div></div>

 <nav class="model-list" id="model-list" aria-label="30 mô hình KPI"></nav>

 </aside><main class="main"><header class="topbar">
 <div class="head-left"><div class="eyebrow">Data Intelligence / Interactive Matrix</div><div class="headline">KPI Dashboard · Neon Visualization Laboratory</div></div>

 </header><section id="dashboardArea" class="workspace"></section></main>`;
 $("#category").value=ui.category;
 $("#search").value=ui.search;
 $("#search").addEventListener("input",e=>{ui.search=e.target.value;renderNav()});
 $("#category").addEventListener("change",e=>{ui.category=e.target.value;renderNav()});
 renderNav();renderDashboard();
}
function renderNav(){
 const list=models.filter(m=>(ui.category==="Tất cả"||m.category===ui.category)&&(m.name+" "+m.subtitle+" "+m.category).toLocaleLowerCase("vi").includes(ui.search.toLocaleLowerCase("vi")));
 $("#found").textContent=list.length+" / "+models.length;
 $("#model-list").innerHTML=list.length?list.map(m=>`<button class="model-btn ${m.id===ui.id?"active":""}" data-id="${m.id}" title="${safe(m.name)}" aria-current="${m.id===ui.id?"page":"false"}"><span class="emoji">${m.icon}</span><span class="name">${safe(m.name)}</span><span class="num">${String(m.index+1).padStart(2,"0")}</span></button>`).join(""):`<div class="empty">Không tìm thấy mô hình phù hợp.</div>`;
}
function renderDashboard(){
 const m=model(),types=typesFor(m),area=$("#dashboardArea");area.style.setProperty("--h",m.hue);
 const keepScroll=area.scrollTop;
 area.innerHTML=`<div class="overview"><div class="section-title"><div class="bigicon">${m.icon}</div><div><h1>${safe(m.name)} <span style="color:hsl(${m.hue} 100% 68%)">/ KPI Intelligence</span></h1><p>${safe(m.subtitle)} · 9 trực quan trong cùng ma trận</p></div></div><div class="flag">◈ DỮ LIỆU GIẢ ĐỊNH / DEMO</div></div>
 <div class="toolbar"><div class="inline-controls"><label class="filter">◴ Chu kỳ <select id="period"><option value="7">7 ngày</option><option value="30">30 ngày</option><option value="90">90 ngày</option></select></label>
 <label class="filter">⌖ Khu vực <select id="region"><option>Toàn quốc</option><option>Miền Bắc</option><option>Miền Trung</option><option>Miền Nam</option></select></label>
 </div><div class="tool-actions"><span class="shortcuts">Mô phỏng có thể thay đổi dữ liệu hiển thị</span><button class="btn sim-toggle" data-action="toggle"><span class="sim-dot ${ui.running?"on":""}"></span>${ui.running?"Tạm dừng mô phỏng":"Chạy mô phỏng"}</button></div></div>
 <div class="metrics">${m.metrics.map((x,k)=>`<article class="metric"><div><div class="label">${safe(x.label)}</div><div class="value">${safe(x.value)}</div></div><div class="delta">${safe(x.delta)}</div></article>`).join("")}</div>
 <div class="matrix-head"><strong>◫ MATRIX 3 × 3 <span class="count"> / 09 VISUALIZATIONS</span></strong><span>Chỉ số quy đổi / đơn vị tương đối · <span id="simTime">Kỳ mô phỏng ${ui.tick}</span></span></div>
 <div class="chart-grid">${types.map((t,i)=>`<article class="chart-card"><div class="chart-head"><span class="chart-title" title="${safe(chartNames[t])}">${String(i+1).padStart(2,"0")}. ${safe(chartNames[t])}</span><span class="tools"><button class="icon-btn" title="Mở rộng và giải thích" aria-label="Mở rộng biểu đồ ${i+1}" data-action="expand" data-i="${i}">⤢</button><button class="icon-btn" title="Copy SVG biểu đồ" aria-label="Copy SVG biểu đồ ${i+1}" data-action="copy-svg" data-i="${i}">⧉</button></span></div><div class="chart-content">${svgChart(t,m,i)}</div><div class="chart-foot"><span>${safe(m.axes[i%m.axes.length])}</span><em>${safe(t.toUpperCase())} · DEMO</em></div></article>`).join("")}</div>
 <footer class="footer"><span>Dữ liệu demo · Chỉ số mang tính chất mô phỏng · Long Ngo 2026 · Giấy phép MIT</span><span>30 models · 9 charts / model · <a href="https://github.com/Base27-CVNSS/dashboard" target="_blank" rel="noopener">GitHub Source ↗</a></span></footer>`;
 $("#period").value=ui.period;$("#region").value=ui.region;
 $("#period").addEventListener("change",e=>{ui.period=e.target.value;renderDashboard()});
 $("#region").addEventListener("change",e=>{ui.region=e.target.value;renderDashboard()});
 area.scrollTop=keepScroll;
}
function message(s){const el=$("#toast");el.textContent=s;el.style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.style.display="none"},3000)}
async function copyText(s){
 try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(s);message("Đã sao chép vào clipboard");return}}
 catch(e){}
 const ta=document.createElement("textarea");ta.value=s;ta.style.cssText="position:fixed;left:-9999px;top:0";document.body.appendChild(ta);ta.select();
 try{if(document.execCommand("copy"))message("Đã sao chép vào clipboard");else message("Không thể sao chép: hãy dùng Xuất HTML")}
 catch(e){message("Không thể sao chép: hãy dùng Xuất HTML")}
 finally{ta.remove()}
}
function exportedHtml(single){
 const clone=document.documentElement.cloneNode(true);
 const chosen=single?[model()]:models;
 clone.querySelector("#model-data").textContent=JSON.stringify(chosen).replace(/</g,"\\u003c");
 clone.querySelector("#app").innerHTML="";
 const dialog=clone.querySelector("#chart-modal");dialog.removeAttribute("open");dialog.querySelector(".modal-body").innerHTML="";
 clone.querySelector("#toast").textContent="";clone.querySelector("#toast").removeAttribute("style");
 const html="<!doctype html>\n"+clone.outerHTML;
 return html;
}
function downloadText(filename,content,type="text/html;charset=utf-8"){
 const url=URL.createObjectURL(new Blob([content],{type}));
 const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)
}
function expand(i){
 const m=model(),type=typesFor(m)[i],dialog=$("#chart-modal");
 dialog.querySelector("#modal-title").textContent=chartNames[type]+" — "+m.name;
 dialog.querySelector(".modal-body").innerHTML=`<div id="full-svg">${svgChart(type,m,i,true)}</div><p><strong>Giải thích:</strong> ${safe(chartsDescriptions[type])} Trục, nhóm và giá trị trong mô hình này được sinh có kiểm soát để trình diễn kỹ thuật trực quan hóa, không đại diện dữ liệu thực tế của doanh nghiệp hoặc cơ quan.</p><div class="modal-actions"><button class="btn" data-action="copy-svg" data-i="${i}">⧉ Copy SVG</button><button class="btn primary" data-action="download-svg" data-i="${i}">↓ Xuất SVG</button></div>`;
 if(typeof dialog.showModal==="function")dialog.showModal();else dialog.setAttribute("open","");
}
document.addEventListener("click",e=>{
 const nav=e.target.closest("[data-id]");if(nav){ui.id=nav.dataset.id;ui.tick=0;renderNav();renderDashboard();$("#dashboardArea").scrollTop=0;return}
 const b=e.target.closest("[data-action]");if(!b)return;
 const action=b.dataset.action,i=Number(b.dataset.i);
 if(action==="toggle"){ui.running=!ui.running;renderDashboard()}
 else if(action==="download-html")downloadText("kpi-"+model().id+"-matrix.html",exportedHtml(true))
 else if(action==="download-all")downloadText("neon-matrix-30-models.html",exportedHtml(false))
 else if(action==="copy-html")copyText(exportedHtml(true))
 else if(action==="expand")expand(i)
 else if(action==="copy-svg")copyText(svgChart(typesFor(model())[i],model(),i))
 else if(action==="download-svg")downloadText("kpi-"+model().id+"-"+(i+1)+".svg",svgChart(typesFor(model())[i],model(),i),"image/svg+xml;charset=utf-8")
 else if(action==="close-modal")$("#chart-modal").close();
});
document.addEventListener("keydown",e=>{if(e.key==="/"&&!e.ctrlKey&&!e.metaKey&&e.target.tagName!=="INPUT"){const search=$("#search");if(search&&search.offsetParent){e.preventDefault();search.focus()}}});
setInterval(()=>{if(ui.running){ui.tick++;renderDashboard()}},4800);
appShell();
})();</script></body></html>
